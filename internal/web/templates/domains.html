{{define "domains"}}
{{template "head" .}}
<h1>域名</h1>
<form method="post" action="/admin/domains">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="field">
    <label for="domain">域名</label>
    <input id="domain" name="domain" type="text" value="{{.Prefill}}" required maxlength="253" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="richrich.cc.cd">
  </div>
  <button type="submit">添加域名</button>
</form>
{{if .Domains}}
<div class="table-wrap" tabindex="0" role="region" aria-label="域名">
<table class="domains">
  <thead>
    <tr><th>域名</th><th>邮箱</th><th>添加时间</th><th></th></tr>
  </thead>
  <tbody>
    {{range .Domains}}
    <tr>
      <th scope="row" class="addr">{{.Name}}</th>
      <td class="num">{{.Count}}</td>
      <td class="num"><time datetime="{{.RFC}}">{{.Created}}</time></td>
      <td class="action"><a href="/admin/domains/{{.ID}}">管理邮箱</a></td>
    </tr>
    {{end}}
  </tbody>
</table>
</div>
{{else}}
<div class="empty">
  <p>还没有域名。</p>
</div>
{{end}}
{{template "foot" .}}
{{end}}
