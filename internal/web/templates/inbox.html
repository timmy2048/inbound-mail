{{define "inbox"}}
{{template "head" .}}
<h1 class="domain-name">{{.Address}}</h1>
{{if .More}}<div class="banner warn" role="status">收件很多，这里只列出最近 200 封。</div>{{end}}
{{if .Rows}}
<ol class="msg-list">
  {{range .Rows}}
  <li>
    <a href="/m/{{$.Token}}/messages/{{.ID}}">
      <span class="subject">{{.Subject}}</span>
      <span class="from">{{.Sender}}</span>
      <time datetime="{{.ReceivedRFC}}">{{.Received}}</time>
    </a>
  </li>
  {{end}}
</ol>
{{else}}
<div class="empty">
  <p>这个邮箱还没有信。</p>
</div>
{{end}}
{{template "foot" .}}
{{end}}
