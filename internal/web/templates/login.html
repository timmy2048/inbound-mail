{{define "login"}}
{{template "head" .}}
<h1>进入后台</h1>
<form method="post" action="/admin/login">
  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" value="admin" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="password">密码</label>
    <div class="secret">
      <input id="password" name="password" type="password" autocomplete="current-password" required enterkeyhint="done">
      <button type="button" class="secondary" data-reveal="password" aria-pressed="false">显示</button>
    </div>
  </div>
  <button type="submit">进入后台</button>
</form>
{{template "foot" .}}
{{end}}
