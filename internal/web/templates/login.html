{{define "login"}}
{{template "head" .}}
<h1>进入后台</h1>
<p class="lede">只有一个管理员。密码来自环境变量，不写在页面里。</p>
<form method="post" action="/admin/login">
  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" value="admin" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="user-hint">
    <p class="hint" id="user-hint">用户名只给密码管理器记住，登录只核对密码。</p>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required enterkeyhint="done">
  </div>
  <button type="submit">进入后台</button>
</form>
{{template "foot" .}}
{{end}}
